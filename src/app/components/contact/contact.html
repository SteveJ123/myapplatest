<div class="py-16 bg-slate-50">
  <div class="max-w-4xl mx-auto px-4 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
    <h2 class="text-3xl font-extrabold text-slate-900 mb-6">Get in Touch</h2>

    <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700">Full Name</label>
          <input
            type="text"
            [(ngModel)]="formData.name"
            name="name"
            required
            class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sunflower-500 outline-none"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Email Address</label>
          <input
            type="email"
            [(ngModel)]="formData.email"
            name="email"
            required
            class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sunflower-500 outline-none"
          />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Message</label>
        <textarea
          rows="4"
          [(ngModel)]="formData.message"
          name="message"
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sunflower-500 outline-none"
        ></textarea>
      </div>
      <button
        type="submit"
        class="bg-sunflower-500 text-slate-900 px-6 py-3 rounded-lg font-bold hover:bg-sunflower-400 transition w-full md:w-auto"
      >
        Send Message
      </button>
    </form>
  </div>
</div>
