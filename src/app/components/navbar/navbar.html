<nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20 items-center">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center space-x-3">
        <div
          class="rounded-full bg-sunflower-500 flex items-center justify-center font-bold text-slate-900 text-xl shadow-lg"
        >
          <!-- 🌻 -->
          <img src="logo.jpeg" alt="logo" class="w-auto h-14 object-fit" />
        </div>
        <span class="font-bold text-xl tracking-wide text-white"
          >Sunflower<span class="text-sunflower-400">Network</span></span
        >
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8 font-medium">
        <a
          routerLink="/"
          routerLinkActive="text-sunflower-400"
          [routerLinkActiveOptions]="{ exact: true }"
          class="hover:text-sunflower-400 transition"
          >Home</a
        >
        <a
          routerLink="/services"
          routerLinkActive="text-sunflower-400"
          class="hover:text-sunflower-400 transition"
          >Services</a
        >
        <a
          routerLink="/about"
          routerLinkActive="text-sunflower-400"
          class="hover:text-sunflower-400 transition"
          >About Us</a
        >
        <a
          routerLink="/contact"
          routerLinkActive="text-sunflower-400"
          class="hover:text-sunflower-400 transition"
          >Contact Us</a
        >
        <a
          routerLink="/contact"
          class="bg-sunflower-500 text-slate-900 px-5 py-2.5 rounded-lg font-semibold hover:bg-sunflower-400 transition shadow-md"
          >Get Started</a
        >
      </div>

      <!-- Mobile Toggle Button -->
      <div class="md:hidden flex items-center">
        <button
          (click)="isMenuOpen = !isMenuOpen"
          class="text-gray-300 hover:text-white focus:outline-none"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-slate-800 px-4 pt-2 pb-4 space-y-3">
    <a
      routerLink="/"
      (click)="isMenuOpen = false"
      class="block text-gray-300 hover:text-sunflower-400 py-2"
      >Home</a
    >
    <a
      routerLink="/services"
      (click)="isMenuOpen = false"
      class="block text-gray-300 hover:text-sunflower-400 py-2"
      >Services</a
    >
    <a
      routerLink="/about"
      (click)="isMenuOpen = false"
      class="block text-gray-300 hover:text-sunflower-400 py-2"
      >About Us</a
    >
    <a
      routerLink="/contact"
      (click)="isMenuOpen = false"
      class="block text-gray-300 hover:text-sunflower-400 py-2"
      >Contact Us</a
    >
  </div>
</nav>
