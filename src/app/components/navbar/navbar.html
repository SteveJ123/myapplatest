            <div class="relative inline-block text-left">
              <button 
                (click)="toggleDesktopDropdown()" 
                type="button"

                [ngClass]="{ 'text-emerald-600': isDesktopDropdownOpen, 'text-black hover:text-emerald-600': !isDesktopDropdownOpen }"
                [attr.aria-expanded]="isDesktopDropdownOpen"
              >
                <span>Services</span>
                <svg 
                  class="w-4 h-4 transition-transform duration-200" 
                  [ngClass]="{ 'rotate-180': isDesktopDropdownOpen }" 
                  fill="none" 
                  stroke="currentColor" 
                  stroke-width="2.5"

                </svg>
              </button>

              <!-- Desktop Dropdown Card -->
              <div

              >
                <div class="py-1">

                    [href]="service.link" 
                    (click)="closeAllMenus()"
                    class="block px-6 py-3 text-sm text-slate-800 hover:bg-slate-50 hover:text-emerald-600 font-medium transition-colors border-b border-slate-50 last:border-b-0"
                  >
                    {{ service.label }}
                  </a>

              </div>
            </div>

            <a

        <a
          routerLink="/contact"
          routerLinkActive="text-sunflower-400"

        <a

                <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

        </div>

      <div *ngIf="isMobileMenuOpen" class="md:hidden bg-slate-50 border-b border-slate-200 px-4 pt-3 pb-6 space-y-3">

        <a

          <div *ngIf="isMobileDropdownOpen" class="pl-4 space-y-2 border-l-2 border-emerald-500 my-2 bg-white rounded-r-lg py-2 shadow-sm">
