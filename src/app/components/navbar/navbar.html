<nav class="w-full bg-white text-slate-900 font-sans border-b border-slate-200 overflow-x-hidden">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Brand Logo & Title (Optimized width to prevent hiding the hamburger menu) -->
      <div class="flex items-center space-x-2 min-w-0 pr-2">
        <a routerLink="/" class="flex items-center space-x-2 min-w-0">
          <div class="flex-shrink-0 flex items-center justify-center font-bold text-slate-900 text-xl">
            <img src="logo.png" alt="logo" class="w-auto h-10 sm:h-12 object-contain" />
          </div>
          <span class="font-bold text-base sm:text-xl tracking-tight text-black truncate">
            Sunflower<span class="text-sunflower-400"> Networks</span>
          </span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/" routerLinkActive="text-sunflower-400" [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-800 hover:text-emerald-600 font-medium text-sm transition-colors">Home</a>

        <!-- Desktop Services Dropdown -->
        <div class="relative inline-block text-left">
          <button (click)="toggleDesktopDropdown()" type="button"
            class="inline-flex items-center gap-1.5 font-semibold text-sm transition-colors focus:outline-none"
            [ngClass]="{ 'text-emerald-600': isDesktopDropdownOpen, 'text-black hover:text-emerald-600': !isDesktopDropdownOpen }"
            [attr.aria-expanded]="isDesktopDropdownOpen">
            <span>Services</span>
            <svg class="w-4 h-4 transition-transform duration-200" [ngClass]="{ 'rotate-180': isDesktopDropdownOpen }"
              fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
          </button>

          <!-- Desktop Dropdown Card -->
          <div *ngIf="isDesktopDropdownOpen"
            class="absolute left-0 mt-3 w-64 bg-white rounded-lg shadow-xl py-2 z-50 border border-slate-100 ring-1 ring-black ring-opacity-5 transition-all duration-150 transform origin-top-left">
            <div class="py-1">
              <a *ngFor="let service of serviceList" [href]="service.link" (click)="closeAllMenus()"
                class="block px-6 py-3 text-sm text-slate-800 hover:bg-slate-50 hover:text-emerald-600 font-medium transition-colors border-b border-slate-50 last:border-b-0">
                {{ service.label }}
              </a>
            </div>
          </div>
        </div>

        <a routerLink="/about" routerLinkActive="text-sunflower-400" class="hover:text-sunflower-400 transition text-sm font-medium">About Us</a>
        <a routerLink="/price" routerLinkActive="text-sunflower-400" [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-800 hover:text-emerald-600 font-medium text-sm transition-colors">Price</a>
        <a routerLink="/contact" routerLinkActive="text-sunflower-400" class="hover:text-sunflower-400 transition text-sm font-medium">Contact Us</a>
        
        <a routerLink="/contact"
          class="bg-sunflower-500 text-slate-900 px-5 py-2.5 rounded-lg font-semibold hover:bg-sunflower-400 transition shadow-md text-sm">Get Started</a>
      </div>

      <!-- Mobile Menu Hamburger Button (Guaranteed visible via flex-shrink-0) -->
      <div class="md:hidden flex items-center flex-shrink-0">
        <button (click)="toggleMobileMenu()" type="button"
          class="text-slate-900 hover:text-emerald-600 focus:outline-none p-2 rounded-lg border border-slate-200 bg-slate-50" 
          aria-label="Toggle navigation menu">
          <svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2.5" viewBox="0 0 24 24">
            <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" 
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden bg-slate-50 border-b border-slate-200 px-4 pt-3 pb-6 space-y-3 shadow-inner">
    <a routerLink="/" routerLinkActive="text-sunflower-400" [routerLinkActiveOptions]="{ exact: true }"
      class="block text-slate-900 hover:text-emerald-600 font-medium text-base py-1">Home</a>

    <!-- Mobile Collapsible Services Menu -->
    <div class="space-y-2">
      <button (click)="toggleMobileDropdown()" type="button"
        class="w-full flex items-center justify-between text-left font-bold text-base py-1 focus:outline-none"
        [ngClass]="{ 'text-emerald-600': isMobileDropdownOpen, 'text-slate-900': !isMobileDropdownOpen }">
        <span>Services</span>
        <svg class="w-4 h-4 transition-transform duration-200" [ngClass]="{ 'rotate-180': isMobileDropdownOpen }"
          fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      <!-- Mobile Dropdown Items List -->
      <div *ngIf="isMobileDropdownOpen"
        class="pl-4 space-y-2 border-l-2 border-emerald-500 my-2 bg-white rounded-r-lg py-2 shadow-sm">
        <a *ngFor="let service of serviceList" [href]="service.link" (click)="closeAllMenus()"
          class="block px-3 py-2 text-sm font-medium text-slate-700 hover:text-emerald-600 hover:bg-slate-50 rounded-md transition-colors">
          {{ service.label }}
        </a>
      </div>
    </div>

    <a routerLink="/about" routerLinkActive="text-sunflower-400"
      class="block text-slate-900 hover:text-emerald-600 font-medium text-base py-1">About Us</a>
    <a routerLink="/price" routerLinkActive="text-sunflower-400" [routerLinkActiveOptions]="{ exact: true }"
      class="block text-slate-900 hover:text-emerald-600 font-medium text-base py-1">Price</a>
    <a routerLink="/contact" routerLinkActive="text-sunflower-400"
      class="block text-slate-900 hover:text-emerald-600 font-medium text-base py-1">Contact Us</a>
    
    <div class="pt-2">
      <a routerLink="/contact" (click)="closeAllMenus()"
        class="block text-center bg-sunflower-500 text-slate-900 px-5 py-2.5 rounded-lg font-semibold hover:bg-sunflower-400 transition shadow-md">
        Get Started
      </a>
    </div>
  </div>
</nav>
