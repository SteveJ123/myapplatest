<div class="w-full bg-white text-black font-sans overflow-x-hidden p-6 sm:p-8 md:p-12 lg:px-24">
  <!-- Removed inner horizontal px padding so it starts directly at the red mark -->
  <div class="relative max-w-7xl w-full mx-auto py-8 md:py-12 rounded-2xl overflow-hidden">
        
    <!-- Content Container with internal padding for card contents -->
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
    
    <!-- Left Side: Main Heading & Description -->
    <div class="col-span-6 space-y-4 text-center lg:text-left flex flex-col items-center lg:items-start">
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight text-gray-900 leading-tight">
        Graphic Design
      </h1>            

      <p class="text-sm sm:text-base md:text-lg text-gray-600 font-normal leading-relaxed pt-2 text-justify sm:text-center lg:text-left">
        Bring your brand to life with stunning visuals. We design professional banners, course slides, and promotional materials tailored to engage students and parents alike.
      </p>
    </div>

    <!-- Right Side: Contact / Inquiry Form Card -->
    <div class="col-span-6 flex justify-center lg:justify-end w-full">
      <div class="w-full bg-white rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-200">
        
        <h3 class="text-xl sm:text-2xl font-bold text-center text-slate-900 mb-6">
          Drop Us a Message
        </h3>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-4">
          
          <!-- Name Input -->
          <div>
            <input 
              type="text" 
              formControlName="name"
              placeholder="Name*" 
              class="w-full bg-transparent border-b border-slate-300 focus:border-emerald-500 text-sm text-slate-800 placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
            />
            <span *ngIf="isFieldInvalid('name')" class="text-xs text-rose-500 mt-1 block">
              Name is required
            </span>
          </div>

          <!-- Phone Input with Country Code -->
          <div class="flex gap-2">
            <div class="relative flex items-center bg-slate-50 rounded px-2 border-b border-slate-300 shrink-0">
              <span class="text-base mr-1">🇮🇳</span>
              <span class="text-xs font-medium text-slate-700">+91</span>
              <svg class="w-3 h-3 text-slate-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
            <div class="grow">
              <input 
                type="tel" 
                formControlName="phone"
                placeholder="Phone No*" 
                class="w-full bg-transparent border-b border-slate-300 focus:border-emerald-500 text-sm text-slate-800 placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
              />
            </div>
          </div>

          <!-- Email Input -->
          <div>
            <input 
              type="email" 
              formControlName="email"
              placeholder="Email*" 
              class="w-full bg-transparent border-b border-slate-300 focus:border-emerald-500 text-sm text-slate-800 placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
            />
          </div>

          <!-- Business Input -->
          <div>
            <input 
              type="text" 
              formControlName="businessType"
              placeholder="Which Business do you have ?*" 
              class="w-full bg-transparent border-b border-slate-300 focus:border-emerald-500 text-sm text-slate-800 placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
            />
          </div>

          <!-- Location Input -->
          <div>
            <input 
              type="text" 
              formControlName="location"
              placeholder="Location*" 
              class="w-full bg-transparent border-b border-slate-300 focus:border-emerald-500 text-sm text-slate-800 placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
            />
          </div>

          <!-- Message Input -->
          <div>
            <textarea 
              rows="2"
              formControlName="message"
              placeholder="Message*" 
              class="w-full bg-transparent border-b border-slate-300 focus:border-emerald-500 text-sm text-slate-800 placeholder-slate-400 py-2.5 px-1 outline-none transition-colors resize-none"
            ></textarea>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-[#32b5ab] hover:bg-[#28968e] text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2 mt-4 text-xs sm:text-sm tracking-wide"
          >
            <span>Submit</span>
            <svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
            </svg>
          </button>

        </form>

      </div>
    </div>

  </div>
</div>
    
  </div>
</div>
