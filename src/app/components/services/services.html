<div class="py-16 bg-slate-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-3xl mx-auto">
      <h2 class="text-3xl font-extrabold text-slate-900">Our Enterprise Network Services</h2>
      <p class="mt-4 text-slate-600">
        Tailored networking solutions engineered for maximum performance, security, and scalability.
      </p>
    </div>

    <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-8">
      <div
        *ngFor="let service of services"
        [routerLink]="service.route ? service.route : null"
        [class.cursor-pointer]="service.route"
        class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition"
      >
        <div
          class="w-12 h-12 mx-auto bg-sunflower-100 text-sunflower-700 rounded-lg flex items-center justify-center text-2xl mb-6 text-center"
        >
          <!-- {{ service.icon }} -->
            <img [src]="service.icon" alt="">
        </div>
        <h3 class="text-xl font-bold text-slate-900 text-center">{{ service.title }}</h3>
        <p class="mt-3 text-slate-600 leading-relaxed text-justify">{{ service.description }}</p>
        <div class="mt-6 text-center" *ngIf="service.route">
      <span class="inline-block px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-lg transition-colors">
        <a [routerLink]="service.route ? service.route : null">Click Here →</a>
        
      </span>
    </div>
      </div>
    </div>
  </div>
</div>
