<div class="relative min-h-screen w-full bg-white text-slate-900 font-sans flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <!-- Background Image & Overlay Layer -->
  <div class="absolute inset-0 z-0">
    <img 
      src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1920&q=80" 
      alt="Hero Background" 
      class="w-full h-full object-cover object-center"
    />
    <!-- Dark overlay to ensure contrast and readability on top of the image -->
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-[2px]"></div>
  </div>
      
      <!-- Content Container -->
      <div class="relative z-10 max-w-7xl w-full mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">
          
          <!-- Left Side: Main Heading & Description -->
          <div class="lg:col-span-7 space-y-6 text-left">
            <div class="space-y-1">
              <!-- Outlined / Strokefill Top Text Header -->
              <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white stroke-text leading-none select-none">
                Website
              </h1>
              <!-- Solid Bottom Text Header -->
              <h2 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white leading-none">
                Development
              </h2>
            </div>

            <!-- Description Line -->
            <p class="text-white text-sm sm:text-base md:text-lg max-w-xl font-normal leading-relaxed pt-2">
              Unlock the Power of Web Presence with our Professional Website Designing Service! Elevate Your Online Presence with Stunning Website Designs.
            </p>
          </div>

          <!-- Right Side: Contact / Inquiry Form Card -->
          <div class="lg:col-span-5 flex justify-center lg:justify-end">
            <div class="w-full max-w-md bg-slate-900 text-white rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-800">
              
              <h3 class="text-xl sm:text-2xl font-bold text-center text-white mb-6">
                Drop Us a Message
              </h3>

              <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-4">
                
                <!-- Name Input -->
                <div>
                  <input 
                    type="text" 
                    formControlName="name"
                    placeholder="Name*" 
                    class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
                  />
                  <span *ngIf="isFieldInvalid('name')" class="text-xs text-rose-400 mt-1 block">
                    Name is required
                  </span>
                </div>

                <!-- Phone Input with Country Code -->
                <div class="flex gap-2">
                  <div class="relative flex items-center bg-slate-800/60 rounded px-2 border-b border-slate-700 shrink-0">
                    <span class="text-base mr-1">🇮🇳</span>
                    <span class="text-xs text-slate-300 font-medium">+91</span>
                    <svg class="w-3 h-3 text-slate-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                  </div>
                  <div class="grow">
                    <input 
                      type="tel" 
                      formControlName="phone"
                      placeholder="Phone No*" 
                      class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
                    />
                  </div>
                </div>

                <!-- Email & Service Select Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <input 
                      type="email" 
                      formControlName="email"
                      placeholder="Email*" 
                      class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
                    />
                  </div>
                  <div class="relative">
                    <select 
                      formControlName="service"
                      class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white py-2.5 px-1 outline-none appearance-none cursor-pointer"
                    >
                      <option value="Website Development" class="bg-slate-900 text-white">Website Development</option>
                      <option value="App Development" class="bg-slate-900 text-white">App Development</option>
                      <option value="Digital Marketing" class="bg-slate-900 text-white">Digital Marketing</option>
                    </select>
                    <svg class="w-3.5 h-3.5 text-slate-400 absolute right-1 top-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                  </div>
                </div>

                <!-- Which Business Input -->
                <div>
                  <input 
                    type="text" 
                    formControlName="businessType"
                    placeholder="Which Business do you have ?*" 
                    class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
                  />
                </div>

                <!-- Location Input -->
                <div>
                  <input 
                    type="text" 
                    formControlName="location"
                    placeholder="Location*" 
                    class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white placeholder-slate-400 py-2.5 px-1 outline-none transition-colors"
                  />
                </div>

                <!-- Message Input -->
                <div>
                  <textarea 
                    rows="2"
                    formControlName="message"
                    placeholder="Message*" 
                    class="w-full bg-transparent border-b border-slate-700 focus:border-emerald-400 text-sm text-white placeholder-slate-400 py-2.5 px-1 outline-none transition-colors resize-none"
                  ></textarea>
                </div>

                <!-- Submit Button -->
                <button 
                  type="submit" 
                  class="w-full bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2 mt-4 text-xs sm:text-sm tracking-wide"
                >
                  <span>Connect With Vdigtech Today</span>
                  <svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/>
                  </svg>
                </button>

              </form>

            </div>
          </div>

        </div>
      </div>
    </div>
